name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Deploy to Hostinger via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "*, !node_modules, !.git"
          target: "/home/u779096633/domains/pro20y.com/public_html"
          strip_components: 0
          overwrite: true

      - name: Server Side Refresh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u779096633/domains/pro20y.com/public_html
            # Install and Build on server to ensure fresh data is baked in
            npm install --production || true
            npm run build || true
            # Trigger Hostinger's auto-restart
            touch package.json
            pm2 restart all || true
            # List files for verification
            ls -la src/data/site-content.json
            grep "30 Years" src/data/site-content.json || echo "Still 20?"


