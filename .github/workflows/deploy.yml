name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://pro20y.com

      - name: Create Deployment Zip
        run: |
          # Zip everything needed for production (including hidden .next folder)
          zip -r deploy.zip .next public src/data/site-content.json package.json package-lock.json next.config.ts tsconfig.json

      - name: Upload Zip to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.zip"
          target: "domains/pro20y.com/public_html"
          overwrite: true

      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Move to target and verify
            cd domains/pro20y.com/public_html
            echo "Current Directory: $(pwd)"
            
            # Use fallback for unzip if standard command fails
            if command -v unzip >/dev/null 2>&1; then
              unzip -o deploy.zip
            else
              # Fallback: Use python or node to unzip if native tool is missing
              python3 -m zipfile -e deploy.zip . || npx decompress-cli deploy.zip .
            fi
            
            rm -f deploy.zip
            touch package.json
            pm2 restart all || npx pm2 restart all || pkill -f node || true





